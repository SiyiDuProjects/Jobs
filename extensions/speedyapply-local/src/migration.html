<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>资料迁移 · jobs</title>
    <link rel="stylesheet" href="custom/migration-ui.css" />
    <script src="custom/migration-ui.js" defer></script>
  </head>
  <body>
    <main>
      <h1>把旧资料迁移到 jobs</h1>
      <p>
        先保存并关闭其他 jobs 插件窗口。申请网页无需刷新。迁移期间自动填写暂停。
      </p>
      <p>
        旧资料会先备份并核对恢复结果；有差异的内容由你确认。最后仅清理已核验的旧缓存，登录设置和投递保护会保留。
      </p>
      <p id="status" role="status" aria-live="polite">正在读取迁移状态…</p>
      <div id="actions">
        <button id="start" type="button">备份并核对旧资料</button>
        <button id="resume" type="button" hidden>继续上次迁移</button>
        <button id="apply" type="button" hidden>保存已确认的差异</button>
        <button id="cleanup" type="button" hidden>核验后清理旧缓存</button>
        <button id="supersede" type="button" hidden>
          资料已变化，重新核对
        </button>
      </div>
      <section id="review" aria-label="需要确认的差异"></section>
      <p class="scope">
        这里只处理已确认的 jobs
        旧存储范围。其他浏览器资料和未知存储项不属于本次清理。
      </p>
    </main>
  </body>
</html>
