[project]
name = "jobs-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "httpx>=0.28,<1", "jsonschema>=4.26,<5"]

[project.scripts]
jobs-radar = "jobs_radar.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["jobs_radar"]

[tool.setuptools.package-data]
jobs_radar = ["*.json", "static/*.html", "static/*.css", "static/*.js", "static/manage/*"]
